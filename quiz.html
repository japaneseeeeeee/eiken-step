<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">E</span><span>EIKEN <strong>STEP</strong></span></a><span class="level-badge">4択問題</span></header>
<main>
<section id="homeScreen" class="screen home-screen compact-home"><div class="eyebrow">VOCABULARY QUIZ</div><h1 id="homeTitle">英検2級<br><span>語彙10問。</span></h1><p class="lead">空所に合う語句を選び、答えた直後に解説を確認しましょう。</p><div class="lesson-card"><div class="lesson-icon">✓</div><div class="lesson-copy"><p class="lesson-label">今日のトレーニング</p><h2>英検2級 語彙10問</h2><p>目安時間 5分 ・ 解説つき</p></div><button id="startButton" class="primary-button" type="button">トレーニングを始める</button></div></section>
<section id="quizScreen" class="screen quiz-screen" aria-labelledby="questionHeading" hidden><div class="quiz-topbar"><button id="quitButton" class="text-button" type="button">トップへ</button><div class="progress-copy"><span id="progressText">1 / 10</span><span id="scoreText">正解 0</span></div></div><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1"><div id="progressBar" class="progress-bar"></div></div><article class="question-card"><p id="questionNumber" class="question-number">QUESTION 01</p><h2 id="questionHeading" tabindex="-1">英文を読み込み中です</h2><p class="question-hint">空所に最も適切な語句を選んでください。</p><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite" hidden><div class="feedback-heading"><span id="feedbackIcon" class="feedback-icon"></span><div><p id="feedbackResult"></p><strong id="feedbackAnswer"></strong></div></div><p id="feedbackExplanation" class="explanation"></p><p id="feedbackTranslation" class="translation"></p><button id="nextButton" class="primary-button next-button" type="button">次の問題へ</button></div></article></section>
